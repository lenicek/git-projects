<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nabídněte svůj vůz společnosti LOSL. Vyplňte formulář a přiložte fotografie vozidla.">
  <title>Nabídněte nám svůj vůz | LOSL s.r.o.</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="main-header">
    <div id="logo">
      <a href="index.html" aria-label="LOSL – úvodní stránka">
        <img src="img/logo-losl.svg" alt="LOSL Logo" fetchpriority="high">
      </a>
    </div>
    <button id="nav-toggle" aria-label="Otevřít hlavní menu" aria-expanded="false">☰</button>
    <nav id="main-nav" aria-label="Hlavní navigace">
      <ul>
        <li><a href="o-firme.html">O firmě</a></li>
        <li><a href="nabidka-vozu.html">Nabídka vozidel</a></li>
        <li><a href="navesy-kogel.html">Nové návěsy</a></li>
        <li><a href="prodej-vozu.html">Prodej vozů</a></li>
        <li><a href="vykup-vozu.html" aria-current="page">Výkup vozů</a></li>
        <li><a href="dovoz.html">Dovoz</a></li>
        <li><a href="financovani-vozu.html">Financování</a></li>
        <li><a href="https://www.czechfinance.cz/" target="_blank" rel="noopener">Pronájem</a></li>
        <li><a href="servis-vozu.html">Servis</a></li>
        <li><a href="kontakty.html">Kontakty</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="vehicle-offer-section" aria-labelledby="vehicle-offer-title">
      <form
        class="vehicle-offer-form"
        action="/cz/komisni-prodej/dekujeme.html"
        method="post"
        enctype="multipart/form-data"
        id="komisni-prodej"
      >
        <div class="vehicle-offer-heading">
          <h1 id="vehicle-offer-title">Nabídněte nám svůj vůz</h1>
          <p>Pole označená <span class="vehicle-offer-required" aria-hidden="true">*</span> jsou povinná</p>
        </div>

        <div class="vehicle-offer-fields">
          <div class="vehicle-offer-field">
            <label for="company">Jméno, název firmy <span class="vehicle-offer-required" aria-hidden="true">*</span></label>
            <input class="form-input" type="text" name="company" id="company" autocomplete="name" required>
          </div>
          <div class="vehicle-offer-field">
            <label for="phone">Váš telefon <span class="vehicle-offer-required" aria-hidden="true">*</span></label>
            <input class="form-input" type="tel" name="phone" id="phone" autocomplete="tel" required>
          </div>
          <div class="vehicle-offer-field">
            <label for="email">Váš e-mail <span class="vehicle-offer-required" aria-hidden="true">*</span></label>
            <input class="form-input" type="email" name="email" id="email" autocomplete="email" required>
          </div>
          <div class="vehicle-offer-field">
            <label for="brand">Vozidlo <span class="vehicle-offer-required" aria-hidden="true">*</span></label>
            <input class="form-input" type="text" name="brand" id="brand" placeholder="např. DAF XF 480" required>
          </div>
          <div class="vehicle-offer-field">
            <label for="year">První registrace</label>
            <input class="form-input" type="text" name="year" id="year" placeholder="MM/RRRR" inputmode="numeric">
          </div>
          <div class="vehicle-offer-field">
            <label for="mileage">Najeto</label>
            <input class="form-input" type="number" name="mileage" id="mileage" min="0" placeholder="km">
          </div>
          <div class="vehicle-offer-field">
            <label for="price">Cena</label>
            <input class="form-input" type="text" name="price" id="price" placeholder="Kč">
          </div>
          <div class="vehicle-offer-field vehicle-offer-message">
            <label for="desc">Vaše zpráva</label>
            <textarea class="form-input" name="desc" id="desc" rows="6" placeholder="Stav vozu, výbava, servisní historie..."></textarea>
          </div>
          <div class="vehicle-offer-field vehicle-offer-photos">
            <span class="vehicle-offer-upload-label" id="upload-label">Fotografie (jpeg/png/gif)</span>
            <label class="vehicle-offer-dropzone" for="upload" aria-describedby="upload-help">
              <input
                class="vehicle-offer-file-input"
                type="file"
                name="upload[]"
                id="upload"
                accept="image/jpeg,image/png,image/gif"
                multiple
                aria-labelledby="upload-label"
              >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 3h-9a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9"></path>
                <path d="M14 3v5h5M16 3v5h5M18.5 13v6M15.5 16h6"></path>
                <path d="m6 17 3.5-4 2.5 3 1.5-2 2.5 3"></path>
              </svg>
              <strong>Vyberte fotografie ze zařízení</strong>
              <span id="upload-help">Formáty JPG, PNG nebo GIF</span>
            </label>
          </div>
          <input type="hidden" name="pobocka" value="1">
          <input type="hidden" name="check" value="474GGT35MM1700">
          <button class="vehicle-offer-submit" type="submit" name="submit">Odeslat</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <div class="footer-bottom">
      <p class="copyright">© LOSL s.r.o.</p>
    </div>
  </footer>

</body>
</html>
